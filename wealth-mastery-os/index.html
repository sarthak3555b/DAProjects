<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="Wealth Mastery OS — a living learning operating system to master money, business, investing, technology and capital allocation over 10 years." />
  <meta name="theme-color" content="#0B0F19" />
  <title>Wealth Mastery OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B0F19'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%233b82f6' font-family='Arial' font-weight='bold'%3EW%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div id="app-loading" class="boot-screen">
    <div class="boot-logo">W</div>
    <div class="boot-title">Wealth Mastery OS</div>
    <div class="boot-bar"><span></span></div>
  </div>

  <div id="app" class="app-shell" hidden>
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="brand" data-route="dashboard" role="button" tabindex="0" aria-label="Go to dashboard">
        <div class="brand-mark">W</div>
        <div class="brand-text">
          <strong>Wealth Mastery</strong>
          <span>Operating System</span>
        </div>
      </div>

      <nav class="nav" id="main-nav" aria-label="Sections"></nav>

      <div class="sidebar-foot">
        <div class="streak-pill" id="sidebar-streak" title="Current learning streak">
          <span class="flame">🔥</span><span id="streak-count">0</span><span class="streak-label">day streak</span>
        </div>
        <div class="philosophy">Learn · Build · Observe · Reflect · Implement · Review · Repeat</div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-toggle" aria-label="Toggle menu">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>

        <div class="searchbar" role="search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="global-search" type="text" placeholder="Search nodes, modules, resources, careers…  (press /)" autocomplete="off" aria-label="Global search" />
          <kbd>/</kbd>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn" id="mentor-btn" title="AI Mentor" aria-label="Open AI Mentor">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3a7 7 0 00-7 7v1a3 3 0 003 3v3l3-2h4a4 4 0 004-4v-1a7 7 0 00-7-7z" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="9.5" cy="10.5" r="1" fill="currentColor"/><circle cx="14.5" cy="10.5" r="1" fill="currentColor"/></svg>
          </button>
          <button class="icon-btn" id="notif-btn" title="Notifications" aria-label="Notifications">
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 9a6 6 0 0112 0c0 5 2 6 2 6H4s2-1 2-6z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M10 20a2 2 0 004 0" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
            <span class="notif-dot" id="notif-dot" hidden></span>
          </button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <!-- Search results overlay -->
    <div id="search-overlay" class="search-overlay" hidden>
      <div class="search-panel" role="dialog" aria-label="Search results">
        <div id="search-results" class="search-results"></div>
      </div>
    </div>

    <!-- AI Mentor drawer -->
    <div id="mentor-drawer" class="drawer" hidden aria-label="AI Mentor">
      <div class="drawer-head">
        <div class="drawer-title"><span class="mentor-avatar">AI</span> Mentor</div>
        <button class="icon-btn" id="mentor-close" aria-label="Close mentor">✕</button>
      </div>
      <div id="mentor-body" class="drawer-body"></div>
      <form id="mentor-form" class="mentor-form">
        <input id="mentor-input" type="text" placeholder="Tell your mentor what you learned…" autocomplete="off" />
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </div>
    <div id="drawer-scrim" class="drawer-scrim" hidden></div>

    <!-- Notifications popover -->
    <div id="notif-popover" class="popover" hidden></div>

    <!-- Toasts -->
    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

    <!-- Generic modal -->
    <div id="modal-root" class="modal-root" hidden></div>
  </div>

  <!-- Data -->
  <script src="js/data/curriculum.js"></script>
  <script src="js/data/resources.js"></script>
  <script src="js/data/careers.js"></script>
  <script src="js/data/news.js"></script>
  <!-- Core -->
  <script src="js/store.js"></script>
  <script src="js/util.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/search.js"></script>
  <script src="js/mentor.js"></script>
  <script src="js/roadmap.js"></script>
  <!-- Views -->
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/roadmap.js"></script>
  <script src="js/views/node.js"></script>
  <script src="js/views/projects.js"></script>
  <script src="js/views/resources.js"></script>
  <script src="js/views/affairs.js"></script>
  <script src="js/views/journal.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/career.js"></script>
  <script src="js/views/settings.js"></script>
  <!-- App -->
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
